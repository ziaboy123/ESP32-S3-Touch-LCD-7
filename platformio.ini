; Zia's Panel — Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911 touch,
; ESP32-S3R8: 8MB octal PSRAM in-package, 8MB GigaDevice flash).
; pioarduino = arduino-esp32 3.x (ESP-IDF 5.x), needed for esp_lcd's RGB
; panel driver with bounce buffers.
[env:panel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
lib_deps =
  lvgl/lvgl@~9.2.2
  bblanchon/ArduinoJson@^7.2.0

